steps:
  # Build the container image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/anime-scraper-engine:$COMMIT_SHA"
      - "-t"
      - "$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/anime-scraper-engine:latest"
      - "."

  # Push the container image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "--all-tags"
      - "$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/anime-scraper-engine"

  # Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "$_SERVICE_NAME"
      - "--image"
      - "$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/anime-scraper-engine:$COMMIT_SHA"
      - "--region"
      - "$_REGION"
      - "--port"
      - "8080"
      - "--memory"
      - "1Gi"
      - "--timeout"
      - "900s"
      - "--min-instances"
      - "0"
      - "--max-instances"
      - "1"
      - "--set-env-vars"
      - "SCRAPER_RUN_ONCE=false,SCRAPER_ENABLE_EMBEDDED_SCHEDULER=true"
      - "--set-secrets"
      - "SUPABASE_URL=supabase-url:latest,SUPABASE_SERVICE_ROLE_KEY=supabase-service-role-key:latest,SCRAPER_MANUAL_RUN_TOKEN=manual-run-token:latest,R2_ACCOUNT_ID=r2-account-id:latest,R2_ACCESS_KEY_ID=r2-access-key-id:latest,R2_SECRET_ACCESS_KEY=r2-secret-access-key:latest,GOOGLE_CSE_API_KEY=google-cse-api-key:latest,GOOGLE_CSE_CX=google-cse-cx:latest"
      - "--allow-unauthenticated"

images:
  - "$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/anime-scraper-engine:$COMMIT_SHA"
  - "$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/anime-scraper-engine:latest"

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: "us-central1"
  _REPO: "anime-scraper"
  _SERVICE_NAME: "anime-scraper-engine"
